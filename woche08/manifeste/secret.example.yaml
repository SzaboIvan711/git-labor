# ============================================================================
# EXAMPLE FILE -- DO NOT COMMIT WITH REAL VALUES.
# ============================================================================
#
# This is how the database connection would be provided as a Secret. Steps:
#
#   cp secret.example.yaml secret.yaml     # make a copy
#   # put a real value into secret.yaml
#   # keep secret.yaml out of version control (see .gitignore)
#
# IMPORTANT: a Secret is NOT encrypted, only base64-encoded. Anyone with read
# access to Secrets in this namespace can read the plaintext:
#
#   kubectl -n taskboard get secret taskboard-secret \
#     -o jsonpath='{.data.DATABASE_URL}' | base64 -d
#
# Real protection comes only from RBAC (who may read Secrets?) and
# "encryption at rest" (store etcd encrypted). See docs/05.
#
# stringData takes plaintext; Kubernetes base64-encodes it on creation.
# (Alternatively, "data" takes already-base64-encoded values.)
#
# In THIS lab the app runs WITHOUT a database (in-memory store) on purpose, so
# the Deployment does NOT wire in this Secret -- pointing at a non-existent
# database would make the readiness probe (/ready) fail permanently and no pod
# would ever become Ready.
apiVersion: v1
kind: Secret
metadata:
  name: taskboard-secret
  namespace: taskboard
  labels:
    app: taskboard
type: Opaque
stringData:
  DATABASE_URL: "postgresql://taskboard:changeme@taskboard-db:5432/taskboard"
