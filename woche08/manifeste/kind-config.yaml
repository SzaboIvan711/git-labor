# kind cluster for the Taskboard lab: one control-plane node and two workers,
# so pods can be spread across nodes (scheduling and self-healing become visible).
#
# NOTE: this is a kind configuration, NOT a Kubernetes manifest. It is read by
# "kind create cluster --config kind-config.yaml", not by "kubectl apply", and
# therefore does not appear in --dry-run checks.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: taskboard
nodes:
  - role: control-plane
    # Forward NodePort 30080 from the host to this node so that
    # http://localhost:30080 reaches the NodePort service (service-nodeport.yaml).
    # kube-proxy routes from here to a READY pod on any node.
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
